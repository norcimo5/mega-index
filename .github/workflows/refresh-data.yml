name: Refresh draw data

on:
  schedule:
    # Wednesday and Saturday 09:00 UTC (draws are Tuesday and Friday nights)
    - cron: "0 9 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed to dispatch the Pages deploy below

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and rebuild data files
        run: python3 tools/refresh_data.py
      - name: Commit and push if changed
        id: commit
        run: |
          # draws-data.js embeds a generation timestamp, so compare draws.csv only
          if git diff --quiet -- data/draws.csv; then
            echo "No new draws."
            git checkout -- src/web/js/draws-data.js data/ 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # TODO: src/web/sw.js cache version must change for installed PWAs to
          # pick up new data; check how sw.js derives it (MM_DRAWS_UPDATED?).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.csv src/web/js/draws-data.js
          git commit -m "data: refresh Mega Millions draws"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Pages deploy
        # pushes made with GITHUB_TOKEN do not trigger other workflows
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
