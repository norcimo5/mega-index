name: Refresh draw data

on:
  schedule:
    # Morning after every draw, 09:00 UTC: Powerball Mon/Wed/Sat, Mega Millions Tue/Fri
    - cron: "0 9 * * 0,2,3,4,6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed to dispatch the Pages deploy below

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and rebuild data files
        run: python3 tools/refresh_data.py --game all
      - name: Commit and push if changed
        id: commit
        run: |
          # draws-data.js embeds a generation timestamp, so compare the canonical CSVs only
          if git diff --quiet -- data/draws.csv data/powerball-draws.csv; then
            echo "No new draws."
            git checkout -- data/ src/web/js/draws-data.js src/web/power/js/draws-data.js 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both service workers key their cache on the data timestamp and draw count
          # (via importScripts of draws-data.js), so no manual SW version bump is needed.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/draws.csv data/powerball-draws.csv \
            data/mega-millions-ny-opendata-raw.csv data/powerball-ny-opendata-raw.csv \
            src/web/js/draws-data.js src/web/power/js/draws-data.js
          git commit -m "data: refresh Mega Millions and Powerball draws"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Pages deploy
        # pushes made with GITHUB_TOKEN do not trigger other workflows
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
